<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна 4</title>
</head>

<body>
    <header>
        <h1>Форма для студентської картки</h1>
    </header>
    <main>
        <form action="." method="post" enctype="multipart/form-data">
        <section>
            <h2>Персональна інформація </h2>
            <fieldset>
                <legend>Надайте свої дані</legend>
                    <label for="name">Ім'я:</label>
                    <input type="text" id="name" name="name" placeholder="Ім'я">
                    <p></p>
                    <label for="email">Електронна пошта:</label>
                    <input type="email" id="email" name="email" placeholder="Електронна пошта">
                    <p></p>
                    <label for="password">Пароль:</label>
                    <input type="password" id="password" name="password" placeholder="Пароль">
                    <p></p>
                    <label for="age">Вік:</label>
                    <input type="number" id="age" name="age" placeholder="вік">
                    <p></p>
                    <label for="birthDate">Дата народження:</label>
                    <input type="date" id="birthDate" name="birthDate" placeholder="Дата народження">
                    <p></p>
                    <label for="gender">Стать:</label>
                    <p></p>
                    <input type="radio" name="gender" value="male" id="male">
                    <label for="male">Чоловіча</label>
                    <p></p>
                    <input type="radio" name="gender" value="female" id="female">
                    <label for="female">Жіноча</label>
                    <p></p>
                    <input type="radio" name="gender" value="other" id="other">
                    <label for="other">Інша</label>
                    <p></p>
                    <label for="languages">Мови:</label>
                    <p></p>
                    <input type="checkbox" name="language" value="ukrainian" id="ukrainian">
                    <label for="ukrainian"> Українська</label>
                    <p></p>
                    <input type="checkbox" name="language" value="english" id="english">
                    <label for="english"> Англійська</label>
                    <p></p>
                    <input type="checkbox" name="language" value="german" id="german">
                    <label for="german"> Німецька</label>
                    <p></p>
                    <label for="country">Країна:</label>
                    <select name="country" id="country">
                        <option value="select">Оберіть країну</option>
                        <option value="ukraine">Україна</option>
                        <option value="germany">Німеччина</option>
                        <option value="usa">США</option>
                    </select>
            </fieldset>
        </section>
        <section>
            <h2>Навчальні дисципліни в коледжі</h2>
            <fieldset>
                <legend>Оберіть дисципліни</legend>
                <select multiple name="subjects" id="subjects">
                    <option value="math">Математика</option>
                    <option value="physics">Фізика</option>
                    <option value="programming">Програмування</option>
                    <option value="english">Англійська мова</option>
                    <option value="chemistry">Хімія</option>
                </select>
                <p></p>
                <label for="interest">Оцініть вашу зацікавленість у програмуванні</label>
                <input type="range" min="0" max="10" step="1" id="interest" name="interest">
            </fieldset>
        </section>

        <section>
            <h2>Оцінка навичок</h2>
            <fieldset>
                <legend>Оцініть ваші навички</legend>
                <label for="skills">Опишіть ваші навички:</label>
                <p></p>
                <textarea rows="4" cols="50" id="skills" name="skills" placeholder="Опишіть ваші навички"></textarea>
                <p></p>
                <label for="resume">Завантажити резюме:</label>
                <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx">
                <p></p>
                <label for="favoriteColor">Оберіть улюблений колір:</label>
                <input type="color" id="favoriteColor" name="favoriteColor">
                <p></p>
                <label for="studyTime">Зручний час для навчання:</label>
                <input type="time" id="studyTime" name="studyTime">
                <p></p>
                <input type="submit" value="Надіслати результати опитування">
            </fieldset>
        </section>
        </form>
    </main>
    <footer>
        <p>&copy; Student card by Oleksandr Radionov-Kiptelyi. All rights reserved.</p>
    </footer>
</body>

</html>
