<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roboto Font Example</title>

    <!-- Підключення шрифту Roboto з Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Isometra&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: "Google Sans Flex", sans-serif;
            /* Використання шрифту Roboto */
        }

        h1 {
            font-weight: 700;
            /* Напівжирний варіант шрифту */
        }

        p {
            font-weight: 400;
            /* Звичайний варіант шрифту */
        }

        .box-model-example {
            /* Розміри вмісту */
            width: 250px;
            height: 150px;

            /* Відступи */
            padding: 20px 15px;
            /* Відступи: 20px зверху та знизу, 15px з боків
*/

            /* Рамка */
            border: 5px solid #3498db;
            /* Рамка: 5px, суцільна лінія, блакитний
колір */

            /* Зовнішні відступи */
            margin: 30px 50px;
            /* Зовнішні відступи: 30px зверху і знизу, 50px з
боків */

            /* Фоновий колір для візуалізації */
            background-color: #f0e68c;
        }
    </style>
</head>

<body>
    <h1>Заголовок з шрифтом Roboto</h1>
    <p class="box-model-example">Це приклад використання шрифту Roboto, завантаженого з Google
        Fonts.</p>

</body>

</html>
